openapi: 3.0.3
info:
  title: PadelProTour API
  description: >
    API for managing padel tournaments and leagues: competitions, categories,
    pairs, registrations, phases, matches, match sets, rankings, matchday
    pairings (individual-rotating leagues), and a real-time competition chat.
    Authentication is Bearer-token only (Laravel Sanctum, one token per
    device) — there is no cookie/session-based auth, since clients are
    mobile/Expo apps.
  version: "1.0.0"
servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Me
  - name: Pairs
  - name: Competitions
  - name: Categories
  - name: Registrations
  - name: Phases
  - name: Round Robin
  - name: Matches
  - name: Match Sets
  - name: Matchday Pairings
  - name: Rankings
  - name: Chat Messages

paths:
  /register:
    post:
      tags: [Auth]
      summary: Create an unverified account and send a verification email
      security: []
      description: >
        Rate limited to 5 requests/minute per IP. Does NOT return a token —
        the account must be verified via POST /email/verify (deep link sent
        by email) before it can log in. See VerifyEmailNotification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Account created, unverified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a token
      security: []
      description: >
        Rate limited to 5 requests/minute per email+IP combination. 403 if
        the account's email isn't verified yet. Logging in again with the
        same device_name revokes the previous token for that device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/google:
    post:
      tags: [Auth]
      summary: Log in (or sign up) with a Google id_token
      security: []
      description: >
        The app performs Google's native sign-in itself and sends the
        resulting id_token here for verification (JWKS-based, not a
        redirect flow). New accounts are created already email-verified.
        Rate limited to 10 requests/minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, device_name]
              properties:
                id_token: { type: string, description: Google ID token (JWT) obtained natively by the app. }
                device_name: { type: string }
      responses:
        "200":
          description: Authenticated (new or existing account)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "409":
          description: An account with this email already exists under a different login method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/apple:
    post:
      tags: [Auth]
      summary: Log in (or sign up) with an Apple id_token
      security: []
      description: >
        Same as POST /auth/google but for Apple. Apple only sends the
        user's real name once, outside the id_token (in the native SDK's
        first response) — pass it as `name` on that first call; ignored on
        subsequent logins. Rate limited to 10 requests/minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, device_name]
              properties:
                id_token: { type: string, description: Apple ID token (JWT) obtained natively by the app. }
                device_name: { type: string }
                name: { type: string, nullable: true, description: Only available (and only needed) on the very first sign-in. }
      responses:
        "200":
          description: Authenticated (new or existing account)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "409":
          description: An account with this email already exists under a different login method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /email/verify:
    post:
      tags: [Auth]
      summary: Verify an email address and log in
      security: []
      description: Rate limited to 5 requests/minute per IP. The token comes from the deep link (padelontourapp://verify-email?token=...) sent by VerifyEmailNotification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, device_name]
              properties:
                token: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: Verified and authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthToken" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /email/resend:
    post:
      tags: [Auth]
      summary: Resend the verification email
      security: []
      description: >
        Rate limited to 5 requests/minute per IP. Always returns the same
        generic message regardless of whether the email exists or is
        already verified, to avoid account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current access token
      responses:
        "204": { description: Logged out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [Auth]
      summary: The authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Auth]
      summary: Update your own profile
      description: >
        email and password are intentionally not accepted by this endpoint
        (changing either without re-authentication would be an
        account-takeover risk) — any such fields in the request body are
        silently ignored. All fields are optional; send only what changes.


        **Name lock**: the first name change is free; after that the name
        can only be changed once every 30 days. A change inside the lock
        returns 422 with `errors.name` including the date it will be
        allowed again. Re-sending the current name is not a change. The
        response includes `name_change_available_at` (null = can change
        now).


        Social links store only the user handle (a leading `@` is
        stripped); clients build the URL with each network's own domain.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      tags: [Auth]
      summary: Delete the authenticated account
      description: >-
        Anonymizes the account: personal data, login methods and tokens are
        wiped, unconfirmed registrations are removed, and the user shows as
        "Jugador eliminado" in other players' history (matches and results
        are kept). Requires re-authentication: `password` for accounts with a
        password, or `email` for accounts that only use Google/Apple.
        Rejected with 422 (`account`) while the user organizes a competition
        that is neither cancelled nor finished. Not reversible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: Required for accounts with a password }
                email: { type: string, description: Required for social-login-only accounts }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users:
    get:
      tags: [Me]
      summary: Search players by name
      description: >
        Useful to find a partner's user id before creating a Pair.
        `search` is required (min 2 characters, case-insensitive match on
        the name only) — there is no way to list the full user directory
        unfiltered, and players cannot be looked up by email. Returns at
        most 20 matches with public fields only (never the email).
      parameters:
        - name: search
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicUserSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{user}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Me]
      summary: A player's public profile
      description: >
        Every profile is public to any authenticated user, except the email
        and login data (`provider`, `provider_id`), which are never
        returned. Includes stats computed from the player's completed
        matches, achievements (keys the client translates) and the usual
        partner.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/registrations:
    get:
      tags: [Me]
      summary: My registrations (as an individual player or via a pair)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Registration" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/competitions:
    get:
      tags: [Me]
      summary: Competitions I organize or participate in
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Competition" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /pairs:
    get:
      tags: [Pairs]
      summary: Pairs I belong to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Pairs]
      summary: Form a pair with another player
      description: The authenticated user is always one side of the pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id]
              properties:
                partner_id: { type: integer }
                name: { type: string, nullable: true, maxLength: 255, example: "Los Invencibles", description: Optional display name for the pair. }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /pairs/{pair}:
    parameters:
      - $ref: "#/components/parameters/PairId"
    get:
      tags: [Pairs]
      summary: View a pair
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Competitions]
      summary: Resolve an invite link
      description: >
        Looks up a competition by its invite_token, bypassing the normal
        view policy (which would reject a private competition to someone
        who isn't a participant yet) — knowing the token is itself the
        authorization. Does not register the caller for anything; use the
        normal POST /categories/{category}/registrations flow afterward.
        Rate limited to 10 requests/minute per user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Competition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /invites/{token}/categories:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Competitions]
      summary: List a competition's categories via its invite link
      description: >
        Same idea as GET /invites/{token}: bypasses the normal view policy,
        knowing the token is the authorization. Needed so an invited user
        who isn't a participant yet can see which category to register
        for. Rate limited to 10 requests/minute per user (shares the
        invite limiter).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /competitions:
    get:
      tags: [Competitions]
      summary: List public competitions (paginated, 15/page)
      description: Excludes private competitions (is_private=true) and cancelled ones, even the caller's own. Use GET /me/competitions to see those.
      parameters:
        - name: upcoming
          in: query
          required: false
          description: When truthy (1/true), excludes competitions whose end_date is in the past. Competitions with no end_date are always included.
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCompetitions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Competitions]
      summary: Create a competition
      description: The authenticated user becomes the organizer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompetitionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Competition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /competitions/{competition}:
    parameters:
      - $ref: "#/components/parameters/CompetitionId"
    get:
      tags: [Competitions]
      summary: View a competition
      description: 403 if the competition is private and the caller is neither the organizer nor a participant. See GET /invites/{token} to gain access via a share link.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Competition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Competitions]
      summary: Update a competition (organizer only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompetitionInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Competition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Competitions]
      summary: Delete a competition (organizer only)
      description: Irreversible — cascades to its categories, phases, matches, registrations, rankings and chat messages.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /competitions/{competition}/cancel:
    parameters:
      - $ref: "#/components/parameters/CompetitionId"
    post:
      tags: [Competitions]
      summary: Cancel a competition (organizer only)
      description: >-
        Reversible in the data (the row and its history are kept, nothing is
        deleted), but stops it from accepting new registrations and hides it
        from GET /competitions — it still appears in GET /me/competitions
        for the organizer and existing participants. Rejected with 422 if
        already cancelled. There is no "uncancel" endpoint.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Competition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /competitions/{competition}/regenerate-invite:
    parameters:
      - $ref: "#/components/parameters/CompetitionId"
    post:
      tags: [Competitions]
      summary: Regenerate the invite link token (organizer only)
      description: >-
        Replaces `invite_token` with a new random one. The previous link stops
        working immediately (GET /invites/{token} returns 404 for it). Use it
        when a link has leaked.
      responses:
        "200":
          description: OK — the competition with the new `invite_token`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Competition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /competitions/{competition}/categories:
    parameters:
      - $ref: "#/components/parameters/CompetitionId"
    get:
      tags: [Categories]
      summary: List a competition's categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Categories]
      summary: Create a category (organizer only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /categories/{category}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      summary: View a category
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Categories]
      summary: Update a category (organizer only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Categories]
      summary: Delete a category (organizer only)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /categories/{category}/registrations:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Registrations]
      summary: List a category's registrations (paginated, 15/page)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRegistrations" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Registrations]
      summary: Register a pair or yourself for a category
      description: >
        Send `pair_id` for fixed-pair categories (you must be one of the two
        players) or `player_id` for individual_rotating categories (must
        equal your own id) — never both. Rejected if the competition has
        been cancelled, if its registration_closes_at has passed, or if
        already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pair_id: { type: integer, nullable: true }
                player_id: { type: integer, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /registrations/{registration}:
    parameters:
      - $ref: "#/components/parameters/RegistrationId"
    get:
      tags: [Registrations]
      summary: View a registration
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Registrations]
      summary: Change a registration's status (organizer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/RegistrationStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Registration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Registrations]
      summary: Withdraw a registration
      description: The organizer can always withdraw one; the registrant only while it is still "pending".
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /categories/{category}/phases:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Phases]
      summary: List a category's phases, ordered
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Phase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Phases]
      summary: Create a phase (organizer only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhaseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Phase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /phases/{phase}:
    parameters:
      - $ref: "#/components/parameters/PhaseId"
    get:
      tags: [Phases]
      summary: View a phase
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Phase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Phases]
      summary: Update a phase (organizer only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhaseInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Phase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Phases]
      summary: Delete a phase (organizer only)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /categories/{category}/round-robin:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      tags: [Round Robin]
      summary: Generate a full league schedule (organizer only)
      description: >
        Fixed-pair league categories only. Creates one `matchday` phase per
        round (circle method) from the category's confirmed pair
        registrations, so every pair faces every other pair exactly once.
        An odd number of pairs gets an automatic bye each round. Fails if
        the competition isn't a league, the category isn't fixed-pair,
        there are fewer than 2 confirmed pairs, or matchday phases already
        exist for this category.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Phase" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /phases/{phase}/matches:
    parameters:
      - $ref: "#/components/parameters/PhaseId"
    get:
      tags: [Matches]
      summary: List a phase's matches (paginated, 15/page)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedMatches" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Matches]
      summary: Schedule a match (organizer only)
      description: The four player ids must be distinct.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /matches/{match}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags: [Matches]
      summary: View a match (includes its match_sets)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Matches]
      summary: Update a match (organizer only)
      description: >
        Setting status=completed requires winner_side (1 or 2) in the same
        request. Doing so also recalculates the match's category ranking
        automatically (same computation as POST /categories/{category}/rankings/recalculate) —
        no separate call needed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduled_at: { type: string, format: date-time, nullable: true }
                court: { type: string, nullable: true }
                status: { $ref: "#/components/schemas/MatchStatus" }
                winner_side: { type: integer, enum: [1, 2], nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Matches]
      summary: Delete a match (organizer only)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /matches/{match}/result-proposal:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [Matches]
      summary: Propose the result of a match (players of the match only)
      description: >-
        One of the four players sends the sets (2 or 3). The server validates
        each set score and that one side ends with exactly 2 sets won. The
        sets are stored and the match moves to `pending_validation`
        (`winner_side` set, `result_proposed_by` = caller). Rankings and stats
        only count `completed` matches, so nothing changes until it is
        confirmed. 422 if the match is already completed or pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sets]
              properties:
                sets:
                  type: array
                  minItems: 2
                  maxItems: 3
                  items:
                    type: object
                    required: [side1_games, side2_games]
                    properties:
                      side1_games: { type: integer, minimum: 0 }
                      side2_games: { type: integer, minimum: 0 }
      responses:
        "201":
          description: The match, pending validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /matches/{match}/result-proposal/confirm:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [Matches]
      summary: Confirm a proposed result (a rival of the proposer, or the organizer)
      description: >-
        Moves the match to `completed` and recalculates the category ranking.
        The proposer and their partner cannot confirm. 422 if there is no
        pending proposal.
      responses:
        "200":
          description: The completed match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /matches/{match}/result-proposal/reject:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    post:
      tags: [Matches]
      summary: Reject or withdraw a proposed result
      description: >-
        A rival of the proposer or the organizer rejects it; the proposer can
        also withdraw it. The proposed sets are deleted and the match returns
        to `scheduled`. 422 if there is no pending proposal.
      responses:
        "200":
          description: The match, back to scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Match" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /matches/{match}/sets:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags: [Match Sets]
      summary: List a match's sets, ordered by set_number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Match Sets]
      summary: Record a set score (organizer only)
      description: >-
        Best-of-three: set_number must be 1-3. Rejected if a set with the
        same set_number already exists for this match, if the match is
        already decided (one side has already won 2 sets), or if the score
        is not a valid padel set result (6 games with a 2-game lead, 7-5, or
        7-6 in a tie-break).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [set_number, side1_games, side2_games]
              properties:
                set_number: { type: integer, minimum: 1, maximum: 3 }
                side1_games: { type: integer, minimum: 0, maximum: 7 }
                side2_games: { type: integer, minimum: 0, maximum: 7 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sets/{set}:
    parameters:
      - $ref: "#/components/parameters/SetId"
    get:
      tags: [Match Sets]
      summary: View a set
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Match Sets]
      summary: Correct a set's score (organizer only)
      description: >-
        Rejected if the resulting score (merging any omitted field with the
        set's current value) is not a valid padel set result.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                side1_games: { type: integer, minimum: 0, maximum: 7 }
                side2_games: { type: integer, minimum: 0, maximum: 7 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Match Sets]
      summary: Delete a set (organizer only)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /phases/{phase}/matchday-pairings:
    parameters:
      - $ref: "#/components/parameters/PhaseId"
    get:
      tags: [Matchday Pairings]
      summary: List a matchday's partner pairings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MatchdayPairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Matchday Pairings]
      summary: Pair two players for a matchday (organizer only)
      description: >
        Only for `matchday`-type phases in `individual_rotating` categories.
        Neither player may already be paired (as either player1 or player2)
        elsewhere in the same phase.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player1_id, player2_id]
              properties:
                player1_id: { type: integer }
                player2_id: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchdayPairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /matchday-pairings/{matchday_pairing}:
    parameters:
      - $ref: "#/components/parameters/MatchdayPairingId"
    get:
      tags: [Matchday Pairings]
      summary: View a matchday pairing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchdayPairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Matchday Pairings]
      summary: Change a matchday pairing (organizer only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                player1_id: { type: integer }
                player2_id: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchdayPairing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Matchday Pairings]
      summary: Delete a matchday pairing (organizer only)
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /categories/{category}/rankings:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Rankings]
      summary: The category's current ranking snapshot, ordered by position
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ranking" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /categories/{category}/rankings/recalculate:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    post:
      tags: [Rankings]
      summary: Recalculate the ranking (organizer only)
      description: >
        Win=3pts/loss=0. Only counts completed matches from group/matchday
        phases. Tiebreak: head-to-head (2-way ties only) → set difference →
        game difference → total games won. Replaces the category's previous
        ranking snapshot with a fresh one.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Ranking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /competitions/{competition}/chat-messages:
    parameters:
      - $ref: "#/components/parameters/CompetitionId"
    get:
      tags: [Chat Messages]
      summary: List chat messages (paginated, 30/page, newest first)
      description: Organizer or anyone with a non-rejected registration in the competition.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedChatMessages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Chat Messages]
      summary: Post a chat message
      description: >
        Broadcasts a `message.sent` event on the private `chat.competition.{id}`
        WebSocket channel (Laravel Reverb) to every subscriber authorized on
        that channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /chat-messages/{chat_message}:
    parameters:
      - $ref: "#/components/parameters/ChatMessageId"
    delete:
      tags: [Chat Messages]
      summary: Delete a chat message
      description: The organizer can delete any message; the author can delete their own.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token, as returned by /register or /login.

  parameters:
    UserId: { name: user, in: path, required: true, schema: { type: integer } }
    PairId: { name: pair, in: path, required: true, schema: { type: integer } }
    CompetitionId: { name: competition, in: path, required: true, schema: { type: integer } }
    CategoryId: { name: category, in: path, required: true, schema: { type: integer } }
    RegistrationId: { name: registration, in: path, required: true, schema: { type: integer } }
    PhaseId: { name: phase, in: path, required: true, schema: { type: integer } }
    MatchId: { name: match, in: path, required: true, schema: { type: integer } }
    SetId: { name: set, in: path, required: true, schema: { type: integer } }
    MatchdayPairingId: { name: matchday_pairing, in: path, required: true, schema: { type: integer } }
    ChatMessageId: { name: chat_message, in: path, required: true, schema: { type: integer } }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not allowed to perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No record matches the given id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid input, or a business rule was violated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    ProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 40, description: "Subject to the 30-day lock." }
        level: { type: string, nullable: true, example: "3ª" }
        club: { type: string, nullable: true }
        bio: { type: string, nullable: true, maxLength: 200 }
        city: { type: string, nullable: true, maxLength: 80 }
        preferred_side: { $ref: "#/components/schemas/PreferredSide" }
        dominant_hand: { $ref: "#/components/schemas/DominantHand" }
        avatar_color: { $ref: "#/components/schemas/AvatarColor" }
        avatar_emoji: { type: string, nullable: true, maxLength: 16, example: "🎾", description: "Symbols/emoji only: no letters, digits or spaces." }
        racket: { type: string, nullable: true, maxLength: 80 }
        motto: { type: string, nullable: true, maxLength: 80 }
        availability: { $ref: "#/components/schemas/Availability" }
        social_links: { $ref: "#/components/schemas/SocialLinks" }

    PreferredSide:
      type: string
      nullable: true
      enum: [right, left, both, null]
      description: right = drive, left = revés.

    DominantHand:
      type: string
      nullable: true
      enum: [right, left, null]

    AvatarColor:
      type: string
      nullable: true
      enum: [lime, orange, sky, violet, rose, teal, null]
      description: Palette key; the client maps it to an actual colour.

    Availability:
      type: array
      nullable: true
      maxItems: 21
      items:
        type: string
        pattern: "^(mon|tue|wed|thu|fri|sat|sun)-(morning|afternoon|evening)$"
        example: "mon-evening"

    SocialLinks:
      type: object
      nullable: true
      description: Network => user handle (no URL, no leading @).
      properties:
        instagram: { type: string, nullable: true, example: rodri.padel }
        tiktok: { type: string, nullable: true }
        x: { type: string, nullable: true }
        youtube: { type: string, nullable: true }
        facebook: { type: string, nullable: true }
      additionalProperties: false

    User:
      type: object
      description: The authenticated user's own account (includes the email).
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        level: { type: string, nullable: true, example: "3ª" }
        club: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        city: { type: string, nullable: true }
        preferred_side: { $ref: "#/components/schemas/PreferredSide" }
        dominant_hand: { $ref: "#/components/schemas/DominantHand" }
        avatar_color: { $ref: "#/components/schemas/AvatarColor" }
        avatar_emoji: { type: string, nullable: true }
        racket: { type: string, nullable: true }
        motto: { type: string, nullable: true }
        availability: { $ref: "#/components/schemas/Availability" }
        social_links: { $ref: "#/components/schemas/SocialLinks" }
        name_changed_at: { type: string, format: date-time, nullable: true }
        name_change_available_at:
          type: string
          format: date-time
          nullable: true
          description: "When the name can be changed again; null = can change it now. Present on /me, PUT /me and auth responses."
        has_password: { type: boolean, description: "false for accounts that only use Google/Apple. Present on /me, PUT /me and auth responses; decides whether DELETE /me asks for password or email." }
        provider: { type: string, nullable: true, enum: [google, apple, null], description: null for email/password accounts. }
        email_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PublicUserSummary:
      type: object
      description: What a player search returns about someone else. Never includes the email.
      properties:
        id: { type: integer }
        name: { type: string }
        level: { type: string, nullable: true }
        club: { type: string, nullable: true }
        city: { type: string, nullable: true }
        avatar_color: { $ref: "#/components/schemas/AvatarColor" }
        avatar_emoji: { type: string, nullable: true }

    PlayerStats:
      type: object
      description: Computed from the player's completed matches.
      properties:
        matches_played: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        win_rate: { type: integer, nullable: true, description: "Percentage 0-100; null with no matches." }
        current_streak: { type: integer, description: Consecutive wins up to the most recent match. }
        best_streak: { type: integer }
        sets_won: { type: integer }
        sets_lost: { type: integer }
        games_won: { type: integer }
        games_lost: { type: integer }
        competitions_played: { type: integer }

    PlayerProfile:
      type: object
      description: Public profile of a player. Never includes the email or login data.
      properties:
        id: { type: integer }
        name: { type: string }
        level: { type: string, nullable: true }
        club: { type: string, nullable: true }
        city: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        preferred_side: { $ref: "#/components/schemas/PreferredSide" }
        dominant_hand: { $ref: "#/components/schemas/DominantHand" }
        avatar_color: { $ref: "#/components/schemas/AvatarColor" }
        avatar_emoji: { type: string, nullable: true }
        racket: { type: string, nullable: true }
        motto: { type: string, nullable: true }
        availability: { $ref: "#/components/schemas/Availability" }
        social_links: { $ref: "#/components/schemas/SocialLinks" }
        created_at: { type: string, format: date-time }
        stats: { $ref: "#/components/schemas/PlayerStats" }
        achievements:
          type: array
          items: { type: string, enum: [first_win, matches_10, matches_50, win_streak_5, champion] }
          description: >
            Unlocked achievements as keys. champion = first in a category of
            a finished, non-cancelled competition.
        usual_partner:
          type: object
          nullable: true
          description: Teammate with the most completed matches together (at least 2).
          properties:
            id: { type: integer }
            name: { type: string }
            matches: { type: integer }

    AuthToken:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }

    UserSummary:
      type: object
      description: Minimal player data embedded in Pair/Registration/Match responses so clients don't have to resolve ids separately.
      properties:
        id: { type: integer }
        name: { type: string }

    Pair:
      type: object
      properties:
        id: { type: integer }
        player1_id: { type: integer }
        player2_id: { type: integer }
        player1: { $ref: "#/components/schemas/UserSummary" }
        player2: { $ref: "#/components/schemas/UserSummary" }
        name: { type: string, nullable: true, example: "Los Invencibles", description: Optional display name set at creation. Falls back to null — clients should show "player1.name / player2.name" when absent. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CompetitionType:
      type: string
      enum: [tournament, league]

    CompetitionInput:
      type: object
      required: [type, name, start_date]
      properties:
        type: { $ref: "#/components/schemas/CompetitionType" }
        name: { type: string, maxLength: 255 }
        venue: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        registration_closes_at: { type: string, format: date-time, nullable: true }
        is_private:
          type: boolean
          default: false
          description: Private competitions are excluded from GET /competitions and require an invite link (or being the organizer/a participant) to view.

    Competition:
      allOf:
        - $ref: "#/components/schemas/CompetitionInput"
        - type: object
          properties:
            id: { type: integer }
            organizer_id: { type: integer }
            invite_token:
              type: string
              nullable: true
              readOnly: true
              description: >
                Only present in the response when the caller is the
                organizer (hidden by default, revealed conditionally by the
                backend). Not present at all for other viewers, not just
                null. Use it to build a share link consumed via
                GET /invites/{token}.
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            cancelled_at:
              type: string
              format: date-time
              nullable: true
              description: Set by POST /competitions/{competition}/cancel. Null means active.

    RegistrationMode:
      type: string
      nullable: true
      enum: [fixed_pair, individual_rotating, null]
      description: null or "fixed_pair" behave the same (pareja fija); only "individual_rotating" changes how registrations/matchday pairings work.

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 255 }
        match_format: { type: string, nullable: true, example: "3 sets, super tie-break" }
        slots: { type: integer, nullable: true, minimum: 1 }
        registration_mode: { $ref: "#/components/schemas/RegistrationMode" }

    Category:
      allOf:
        - $ref: "#/components/schemas/CategoryInput"
        - type: object
          properties:
            id: { type: integer }
            competition_id: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    RegistrationStatus:
      type: string
      enum: [pending, confirmed, waitlisted, rejected]

    Registration:
      type: object
      properties:
        id: { type: integer }
        category_id: { type: integer }
        pair_id: { type: integer, nullable: true }
        player_id: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/RegistrationStatus" }
        pair:
          allOf:
            - $ref: "#/components/schemas/Pair"
          description: Present (with its own player1/player2 embedded) only when pair_id is set. Only on GET (index/show), not on POST/PUT responses.
        player:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          description: Present only when player_id is set. Only on GET (index/show), not on POST/PUT responses.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PhaseType:
      type: string
      enum: [group, elimination_round, matchday]

    PhaseInput:
      type: object
      required: [type, name, order]
      properties:
        type: { $ref: "#/components/schemas/PhaseType" }
        name: { type: string, maxLength: 255 }
        order: { type: integer, minimum: 1 }

    Phase:
      allOf:
        - $ref: "#/components/schemas/PhaseInput"
        - type: object
          properties:
            id: { type: integer }
            category_id: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            matches:
              type: array
              items: { $ref: "#/components/schemas/Match" }
              description: Only present on responses that eager-load it (e.g. round-robin generation).

    MatchStatus:
      type: string
      enum: [scheduled, in_progress, pending_validation, completed]

    MatchInput:
      type: object
      required: [side1_player1_id, side1_player2_id, side2_player1_id, side2_player2_id]
      properties:
        side1_player1_id: { type: integer }
        side1_player2_id: { type: integer }
        side2_player1_id: { type: integer }
        side2_player2_id: { type: integer }
        scheduled_at: { type: string, format: date-time, nullable: true }
        court: { type: string, nullable: true }

    Match:
      allOf:
        - $ref: "#/components/schemas/MatchInput"
        - type: object
          properties:
            id: { type: integer }
            phase_id: { type: integer }
            status: { $ref: "#/components/schemas/MatchStatus" }
            winner_side: { type: integer, enum: [1, 2], nullable: true }
            result_proposed_by: { type: integer, nullable: true, description: "Player who proposed the result while status is pending_validation; null otherwise." }
            side1_player1:
              allOf: [{ $ref: "#/components/schemas/UserSummary" }]
              description: Present on GET /phases/{phase}/matches, GET /matches/{match}, and the Phase.matches embedded in round-robin generation — not on the POST/PUT responses.
            side1_player2: { $ref: "#/components/schemas/UserSummary" }
            side2_player1: { $ref: "#/components/schemas/UserSummary" }
            side2_player2: { $ref: "#/components/schemas/UserSummary" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            match_sets:
              type: array
              items: { $ref: "#/components/schemas/MatchSet" }
              description: Only present on GET /matches/{match}.

    MatchSet:
      type: object
      properties:
        id: { type: integer }
        match_id: { type: integer }
        set_number: { type: integer }
        side1_games: { type: integer }
        side2_games: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MatchdayPairing:
      type: object
      properties:
        id: { type: integer }
        phase_id: { type: integer }
        player1_id: { type: integer }
        player2_id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Ranking:
      type: object
      properties:
        id: { type: integer }
        category_id: { type: integer }
        pair_id: { type: integer, nullable: true }
        player_id: { type: integer, nullable: true }
        points: { type: integer }
        position: { type: integer }
        calculated_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      properties:
        id: { type: integer }
        competition_id: { type: integer }
        author_id: { type: integer }
        body: { type: string }
        author:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    PaginatedCompetitions:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Competition" }

    PaginatedRegistrations:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Registration" }

    PaginatedMatches:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Match" }

    PaginatedChatMessages:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/ChatMessage" }
