# Un solo VPS, dos subdominios: api.padelprotour.net (Laravel, vía PHP-FPM)
# y padelprotour.net (build estático de la web, servido directamente).
# Certbot reescribirá esto para añadir los bloques HTTPS (443) al ejecutar
# `certbot --nginx` — no lo deshagas después.

server {
    listen 80;
    server_name api.padelprotour.net;
    root /var/www/api/public;

    index index.php;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb (WebSockets) -- el proceso real escucha en 127.0.0.1:8080,
    # esto es solo el proxy público en wss://api.padelprotour.net/app/...
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 25M;
}

server {
    listen 80;
    server_name padelprotour.net www.padelprotour.net;
    root /var/www/web;

    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
